# sources.yaml — validated entry points for Routine 1 (Collect)
#
# Each source is a stable blog INDEX / announcements page. Routine 1 starts here
# and follows the fresh links; it never relies on hard-coded article URLs.
#
# Fields:
#   key         Stable identifier. MUST match the key used in data/state.json.
#   platform    google_ads | meta | tiktok | linkedin | bing | chatgpt | mixed
#                 mixed = a multi-platform aggregator (e.g. ppc.land tag pages). The
#                         SOURCE has no single platform; the collector reads EACH article
#                         and sets that item's real platform (one of the five above),
#                         keeping only platforms in our pipeline. The `scope` note says
#                         which side to keep (search-side or social-side).
#   title       Human-readable source name (goes into updates.json -> "source").
#   url         Entry point (index / announcements page).
#   type        official | aggregator
#                 official   = the platform's own blog. Preferred canonical record.
#                 aggregator = 3rd-party (Search Engine Land / PPC Land). Often
#                              repeats official stories -> resolved by dedup Layer 2.
#   cadence     feed (default; the only cadence in use)
#                 feed    = dated article stream -> apply the normal 2-week window by
#                           each article's published date. EVERY source is a feed, so
#                           the 2-week window applies to everything (nothing is exempt).
#                 (A `roundup` cadence — monthly digests exempt from the window — used to
#                  exist for SocialBee; that source was removed, so no source is exempt.)
#   validation  readable = plain in-session fetch returns real, dated article text.
#                 Every source below was confirmed readable on 2026-07-21. Sources
#                 that could not be read were dropped and are intentionally not listed.
#   note        Free-text guidance for the routine.
#
# FETCH METHOD (important): fetch pages with an in-session client (curl / requests /
# browser), NOT the managed WebFetch tool. With egress open, curl gets HTTP 200 from
# every domain, but WebFetch's fetcher is blocked by the sites' anti-bot (403). Read
# dates/titles from each article's JSON-LD ("datePublished") and og: meta tags.
# Re-validate on drift.
#
# CONCURRENCY (verified 2026-08-03): searchengineland.com returns HTTP 504 for most
# requests in a parallel burst (8 at once → 17/20 failed). Fetch SEL article pages at
# a concurrency of 3 or lower and retry the stragglers; every 504 succeeded on retry.
# The other domains tolerate 8 parallel fetches fine.
#
# SEL OUTAGE (observed 2026-08-04): a retry is NOT always enough. The index pages and
# ~14 article pages read fine, then a fixed subset of article URLs returned Cloudflare
# 504 / connection timeouts on every attempt (4 retry rounds over ~40 min, varied UA,
# HTTP/1.1, cache-busting query — all 504), and later the whole domain went 504 for
# already-fetched URLs too. It is an origin-side outage, not anti-bot and not
# concurrency. When it happens: keep the items you could read, skip the unreadable
# ones WITHOUT writing a summary from the index headline, and flag them — the next
# weekly window will have moved past them, so they are lost unless a human re-runs.
# archive.org is NOT a fallback here (403 CONNECT under the egress policy).

sources:
  # ── Google ──────────────────────────────────────────────────────────────────
  - key: google_ads_commerce_blog
    platform: google_ads
    title: Google Ads & Commerce Blog
    url: https://blog.google/products/ads-commerce/
    type: official
    validation: readable
    note: Primary Google Ads source. Server-rendered; article links + JSON-LD dates
      read fine via curl (verified article dated 2026-07-13).

  - key: google_ads_announcements
    platform: google_ads
    title: Google Ads Help — New Features & Announcements
    url: https://support.google.com/google-ads/announcements/9048695?hl=en
    type: official
    validation: readable
    note: Official product announcements. Large server-rendered page, all entries
      inline (verified). High signal-to-noise for features. Updates infrequently —
      on 2026-08-03 the newest entry was still May 20, 2026 (GML 2026), so expect
      this source to contribute nothing on most weekly runs.

  - key: searchengineland_google
    platform: google_ads
    title: Search Engine Land — Google
    url: https://searchengineland.com/library/platforms/google
    type: aggregator
    validation: readable
    note: >-
      ~50 article links with JSON-LD dates (verified article dated 2026-07-17).
      Overlaps official Google sources; prefer official as canonical on dedup. NB the
      top links are a site-wide recent/popular block — pick platform-specific items.
      Index dates — each card sits in `<article class="stream-article …">` (the class
      carries extra tokens, e.g. `stream-article latest ps-0 my-3 pb-4 border-bottom`, so
      don't anchor on the closing quote) and its link+title are in
      `<h2 class="headline"><a href=…>`. The date is in the byline as
      `Mon D, YYYY at H:MM am/pm ET` (re-verified 2026-08-04); there is no `datetime=`
      attribute and no JSON-LD on the index, so parse that byline.
      Highest-volume source in the pipeline (~18 in-window ads items on 2026-08-03).

  # ── Meta ────────────────────────────────────────────────────────────────────
  - key: meta_newsroom_tech
    platform: meta
    title: Meta Newsroom — Technologies
    url: https://about.fb.com/news/category/technologies/
    type: official
    validation: readable
    note: Server-rendered newsroom; ~14 article links + JSON-LD dates (verified article
      dated 2026-07-21). Filter HARD — much is non-ads (consumer/policy/PR).

  - key: searchengineland_meta
    platform: meta
    title: Search Engine Land — Meta
    url: https://searchengineland.com/library/platforms/meta
    type: aggregator
    validation: readable
    note: ~55 article links with dates (verified). Primary practical Meta-ads source.

  # ── TikTok ──────────────────────────────────────────────────────────────────
  - key: searchengineland_tiktok
    platform: tiktok
    title: Search Engine Land — TikTok
    url: https://searchengineland.com/library/platforms/tiktok
    type: aggregator
    validation: readable
    note: ~57 article links with dates (verified). Primary practical TikTok-ads source.

  # ── LinkedIn ────────────────────────────────────────────────────────────────
  - key: socialmediatoday_linkedin
    platform: linkedin
    title: Social Media Today — LinkedIn
    url: https://www.socialmediatoday.com/topic/linkedin/
    type: aggregator
    cadence: feed               # normal dated article feed
    validation: readable
    note: >-
      Standard dated article FEED — apply the normal 2-week window by each article's own
      published date. Verified 2026-07-24 via curl (HTTP 200): the topic page lists ~28
      LinkedIn article links (e.g. /news/<slug>/<id>/). NOTE: dates are NOT on the index —
      open each article and read its JSON-LD `datePublished` / `og:` before applying the
      window. Egress: the correct host is `www.socialmediatoday.com` (the apex 301s to
      www; allowlist the www host, not the apex or a `blogs.` subdomain). Filter HARD to
      ads-manager relevance (Campaign Manager, ad formats, targeting, reporting) — most
      LinkedIn coverage here is organic/social, not ads.

  # ── Bing / Microsoft Advertising ────────────────────────────────────────────
  - key: bing_blogs
    platform: bing
    title: Bing Blogs
    url: https://blogs.bing.com/search?page=1
    type: official
    validation: readable
    note: >-
      Server-rendered; article text + <time> tags present (verified). Broad
      Bing/search news — filter for Microsoft Advertising relevance. Post URLs are
      `/search/<Month-YYYY>/<Title-Slug>` and the index carries no `datetime=`, so the
      month in the URL is the date signal. Publishes rarely and skews Webmaster Tools /
      organic — on 2026-08-03 the newest post was June 2026, i.e. nothing in window.
      searchengineland_microsoft is the reliable Microsoft Ads source.

  - key: searchengineland_microsoft
    platform: bing
    title: Search Engine Land — Microsoft Advertising
    url: https://searchengineland.com/library/platforms/microsoft/microsoft-advertising
    type: aggregator
    validation: readable
    note: ~62 article links with dates (verified). Often higher signal for Microsoft
      Ads than the broad Bing blog.

  # ── ChatGPT Ads (OpenAI) ────────────────────────────────────────────────────
  # Search-team platform. Item `platform` = `chatgpt`; deck display name "ChatGPT Ads".
  - key: seroundtable_chatgpt_ads
    platform: chatgpt
    title: Search Engine Roundtable — ChatGPT Ads
    url: https://www.seroundtable.com/category/chatgpt-ads
    type: aggregator
    cadence: feed
    validation: readable
    note: >-
      Dedicated ChatGPT Ads category feed — the highest-signal source for this platform.
      Verified 2026-08-17 via curl (HTTP 200, ~99 KB): index cards are
      `<h2 class="text-black-text font-bold text-xl"><a href="https://www.seroundtable.com/<slug>-<id>.html">`
      and the date follows in a `<span class="text-sm …">` as `Mon D, YYYY - H:MM am/pm`.
      Article pages read fine (HTTP 200) and carry JSON-LD `"datePublished"` — prefer that
      over the index date. Egress host is `www.seroundtable.com`. Apply the normal 2-week
      window. Still filter per criteria.md: this category is ads-focused, but drop pure
      commentary/speculation with no concrete Ads Manager change.

  - key: searchengineland_chatgpt
    platform: chatgpt
    title: Search Engine Land — ChatGPT
    url: https://searchengineland.com/library/platforms/openai/chatgpt
    type: aggregator
    cadence: feed
    validation: readable
    note: >-
      Verified 2026-08-17 via curl (HTTP 200): ~43 article links, same SEL index structure
      as the other library pages (`<h2 class="headline"><a href=…>` + byline date
      `Mon D, YYYY at H:MM am/pm ET`; no `datetime=`/JSON-LD on the index, so parse the
      byline). **Filter HARD:** this page mixes real ChatGPT *Ads* news (e.g. "ChatGPT Ads
      rolls out oCPC campaigns", "How to run ChatGPT ads") with lots of SEO/organic and
      evergreen ChatGPT content ("What is ChatGPT and why SEOs should care") — keep only
      ads-manager changes per criteria.md. As with other SEL pages, the top links can be a
      site-wide recent/popular block, so pick platform-specific items. Same SEL fetch
      caveats apply (concurrency ≤3; possible origin 504s — see header).

  # NOTE: SEL /library/ppc was evaluated as a third ChatGPT Ads source (readable, HTTP 200)
  # but NOT tracked — it is a broad PPC feed whose ChatGPT items also appear on the two
  # sources above, so it only added duplicates plus evergreen "what is PPC" content.

  # ── PPC Land (multi-platform aggregators) ─────────────────────────────────────
  - key: ppcland_search
    platform: mixed            # per-article platform: google_ads | bing | chatgpt
    title: PPC Land — Search
    url: https://ppc.land/tag/search/
    type: aggregator
    cadence: feed              # dated article feed; dates ARE on the index
    validation: readable
    note: >-
      MIXED search-side aggregator (Google + Microsoft/Bing + ChatGPT Ads, plus a lot of
      pure SEO / organic-search / industry news). Verified 2026-08-03 via curl (HTTP 200): index
      cards are `<a href="/<slug>/">` with the date on the card as
      `<time class="card-post-date" datetime="YYYY-MM-DD">`. One index page holds only
      ~12 cards (~1 week), so page back through `/tag/search/page/2/`, `/page/3/`, …
      until the dates fall before window_start. Apply the normal 2-week
      window by that index date. Scope = keep ONLY ads-manager items about platforms in
      our pipeline: **Google Ads**, **Microsoft/Bing** and **ChatGPT Ads** (set each item's
      `platform` accordingly — google_ads, bing or chatgpt). This feed does carry ChatGPT
      Ads news (verified 2026-08-17: 2 of the 12 cards on page 1), so don't drop it — it
      dedups against the dedicated ChatGPT sources via Layers 1–2.
      Filter HARD per criteria.md — drop SEO / zero-
      click / organic-search / consumer stories (e.g. "AI Mode cuts Shopping listings",
      "zero-click searches", Yelp/Gen-Z items). Aggregator → prefer an official post over
      this in dedup Layer 2.

  - key: ppcland_social
    platform: mixed            # per-article platform: meta | tiktok | linkedin
    title: PPC Land — Social
    url: https://ppc.land/tag/social/
    type: aggregator
    cadence: feed              # dated article feed; dates ARE on the index
    validation: readable
    note: >-
      MIXED social-side aggregator (Meta, TikTok, LinkedIn, plus organic-social / creator
      / industry news). Verified 2026-08-03 via curl (HTTP 200): same structure as
      ppcland_search (index cards `<a href="/<slug>/">` + `<time … datetime>`; ~12 cards
      per page, so page back through `/tag/social/page/N/` until dates precede
      window_start). Apply the normal 2-week window by the index date. Scope = keep ONLY ads-manager items about
      platforms in our pipeline: **Meta**, **TikTok**, **LinkedIn** (set each item's
      `platform` to meta / tiktok / linkedin). Filter HARD per criteria.md — drop organic-
      social / creator / consumer-app stories. Aggregator → prefer official in dedup.
