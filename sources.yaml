# sources.yaml — entry points for Routine 1 (Collect)
#
# This file holds the CURRENT state only: which pages to read, how to read them today,
# and whether each one works right now. History — when a source broke, how it was
# diagnosed, what changed and when — lives in docs/SOURCES_LOG.md. Never append dated
# "still broken" notes here: a source's state is its `validation` (+ `blocked_since`),
# and how long it has been down is visible from that and from data/state.json.
#
# Fields:
#   key            Stable identifier. MUST match the key used in data/state.json.
#   platform       google_ads | bing | chatgpt | meta | tiktok | linkedin | mixed
#                    mixed = a multi-platform source. The collector reads EACH article,
#                    sets that item's real platform (one of the six above) and keeps only
#                    platforms inside the source's `scope`.
#   scope          mixed sources only — which platforms to keep:
#                    search = google_ads, bing, chatgpt · social = meta, tiktok, linkedin
#                    all    = all six
#   title          Human-readable source name (goes into updates.json -> "source").
#   url            Entry point to fetch (index page or feed).
#   type           official   = the platform's own blog; preferred canonical record.
#                  aggregator = third-party news site; often repeats official stories,
#                               resolved by dedup Layer 2 (prefer official).
#   validation     Current status — see STATUS below. Routine 1 keeps it current.
#   blocked_since  Date the source stopped reading. Present only while blocked / broken.
#   note           How to read this source today (structure, dates, pagination, filter).
#
# Every source is a dated feed: the fixed 2-week window applies to all of them.
#
# STATUS (`validation`)
#   readable  Reads normally.
#   pending   Newly added, not yet confirmed by a run. Fetch it like a readable source;
#             the run then sets readable / blocked / broken.
#   blocked   The entry page cannot be fetched: anti-bot challenge, HTTP 4xx/5xx or a
#             timeout after retries, or the run environment refusing the host
#             (curl: "CONNECT tunnel failed, response 403" = egress allowlist).
#   broken    The page fetches (2xx) but no dated article list can be parsed from it —
#             the layout changed or the page moved.
#   For blocked / broken sources make ONE request to `url` per run. If it fails the same
#   way, skip the source at once and move on — no workarounds (no other URLs, feeds,
#   sitemaps, user agents or headless browsers) and nothing written anywhere. If it
#   reads, the source has recovered: read it normally.
#
# FETCHING (all sources)
#   - Use an in-session client (curl / requests), NOT the managed WebFetch tool — its
#     fetcher is blocked by these sites' anti-bot even when egress is open.
#   - Send a desktop-browser User-Agent and `Accept-Language: en-US`. Allow a 60 s
#     timeout (ads.tiktok.com pages are ~1.3 MB and occasionally stall).
#   - Transient failure on a readable/pending source (timeout, 5xx): retry up to 2 more
#     times with a short pause before treating the source as failed for this run.
#   - Dates: prefer the article's JSON-LD "datePublished" (or og: / <time> tags); where
#     the article page has none, use the date shown on the index.
#   - If an index reads but some article pages fail on every retry: keep what you read,
#     skip the rest WITHOUT summarising from the headline, and list them in the PR body.
#
# DOMAIN NOTES (shared by several sources)
#   searchengineland.com — every SEL source is blocked (domain-wide Cloudflare challenge:
#     HTTP 403, `cf-mitigated: challenge`). When it reads again: index cards are
#     `<article class="stream-article …">` (extra class tokens follow), link + title in
#     `<h2 class="headline"><a href=…>`, and the date only in the byline as
#     `Mon D, YYYY at H:MM am/pm ET` (no datetime=, no JSON-LD on the index). The top
#     links are a site-wide recent/popular block — pick platform-specific items. Fetch
#     at a concurrency of 3 or lower (bursts return 504).
#   www.seroundtable.com — category pages: `<h2 class="text-black-text font-bold
#     text-xl"><a href=…>TITLE</a></h2>`, then the date as `Mon D, YYYY - H:MM am/pm`.
#     Page 1 holds ~33 category cards (11 large + a compact list), followed by a
#     site-wide "latest" block that repeats the newest posts of ALL categories — stop at
#     the end of the category list. Older pages: `?page=N`. Articles carry JSON-LD
#     datePublished. Host is `www.seroundtable.com`.
#   www.socialmediatoday.com — topic pages list ~25 articles `/news/<slug>/<id>/` with
#     index dates like `Oct. 20, 2026` (`Sept.` for September); page 1 covers 3+ weeks.
#     The same article often sits on several topic pages — Layer 1 dedup handles that.
#     Articles carry JSON-LD datePublished. Use the www host (the apex 301s to www).
#     Most coverage is organic / creator / consumer — filter HARD to ads-manager changes.

sources:
  # ── Google Ads ──────────────────────────────────────────────────────────────
  - key: google_ads_commerce_blog
    platform: google_ads
    title: Google Ads & Commerce Blog
    url: https://blog.google/products/ads-commerce/rss/
    type: official
    validation: readable
    note: >-
      RSS feed of the Ads & Commerce blog — full dated list (pubDate + title + link per
      item); the HTML index exposes only a few links, so use the feed. It also carries
      ads-relevant posts filed under other blog.google paths (e.g.
      /products-and-platforms/products/shopping/…) — record those under this source
      too. It mixes in consumer Search/Shopping posts; filter per criteria.md.

  - key: google_ads_announcements
    platform: google_ads
    title: Google Ads Help — New Features & Announcements
    url: https://support.google.com/google-ads/announcements/9048695?hl=en
    type: official
    validation: readable
    note: >-
      Large server-rendered page (~2 MB) with every entry inline and dated. High signal
      but updates rarely (newest entry May 20, 2026 as of 2026-10-21) — expect nothing on
      most runs.

  - key: seroundtable_google_ads
    platform: google_ads
    title: Search Engine Roundtable — Google Ads
    url: https://www.seroundtable.com/category/google-adwords
    type: aggregator
    validation: readable
    note: >-
      SER's Google Ads category (see DOMAIN NOTES). ~2–3 posts a day; page 1 alone spans
      about 19 days, so it normally covers the whole window. Carries Merchant Center and
      Hotel Ads items too — filter per criteria.md.

  - key: searchengineland_google
    platform: google_ads
    title: Search Engine Land — Google
    url: https://searchengineland.com/library/platforms/google
    type: aggregator
    validation: blocked
    blocked_since: 2026-09-22
    note: >-
      Cloudflare challenge (see DOMAIN NOTES). When readable: ~50 article links, overlaps
      the official Google sources — prefer official in dedup.

  # ── Microsoft (Bing) Advertising ────────────────────────────────────────────
  - key: microsoft_ads_blog
    platform: bing
    title: Microsoft Advertising Blog
    url: https://about.ads.microsoft.com/en/blog?page=1
    type: official
    validation: readable
    note: >-
      Official blog. 6 posts per page, links `/en/blog/post/<month-yyyy>/<slug>` with
      index dates like `October 21, 2026`; page 1 spans ~6 weeks. Article pages carry no
      JSON-LD date — use the index date. The monthly "What's new in Microsoft
      Advertising" post is the main product-update roundup: record it as one item and
      summarise its account-relevant changes. Microsoft Monetize / publisher posts are
      not ours (criteria.md → product test); holiday tips and brand posts are excluded.

  - key: seroundtable_microsoft_ads
    platform: bing
    title: Search Engine Roundtable — Microsoft Advertising
    url: https://www.seroundtable.com/category/adcenter
    type: aggregator
    validation: readable
    note: >-
      SER's Microsoft Advertising category (slug `adcenter`; see DOMAIN NOTES). Low volume
      (~1 post a week), almost all ads: Microsoft Ads features plus Bing ad-unit tests.
      Used instead of `/category/bing`, which carries the same ads posts buried among
      organic Bing SERP tests.

  - key: bing_blogs
    platform: bing
    title: Bing Blogs
    url: https://blogs.bing.com/search?page=1
    type: official
    validation: readable
    note: >-
      Server-rendered; post URLs are `/search/<YYYY>/<M>/<Title-Slug>/` (numeric year and
      month, e.g. `/search/2026/6/…`) and the month in the URL is the date signal. Publishes rarely and skews Webmaster Tools / organic —
      filter for Microsoft Advertising relevance.

  - key: searchengineland_microsoft
    platform: bing
    title: Search Engine Land — Microsoft Advertising
    url: https://searchengineland.com/library/platforms/microsoft/microsoft-advertising
    type: aggregator
    validation: blocked
    blocked_since: 2026-09-22
    note: >-
      Cloudflare challenge (see DOMAIN NOTES). When readable: ~60 article links, often
      higher signal for Microsoft Ads than the broad Bing blog.

  # ── ChatGPT Ads (OpenAI) ────────────────────────────────────────────────────
  # Search-team platform. Item `platform` = `chatgpt`; deck display name "ChatGPT Ads".
  - key: seroundtable_chatgpt_ads
    platform: chatgpt
    title: Search Engine Roundtable — ChatGPT Ads
    url: https://www.seroundtable.com/category/chatgpt-ads
    type: aggregator
    validation: readable
    note: >-
      Dedicated ChatGPT Ads category (see DOMAIN NOTES) — the highest-signal source for
      this platform. Drop pure commentary/speculation with no concrete Ads Manager change.

  - key: adexchanger_chatgpt_ads
    platform: chatgpt
    title: AdExchanger — ChatGPT Ads
    url: https://www.adexchanger.com/tag/chatgpt-ads/
    type: aggregator
    validation: readable
    note: >-
      WordPress tag page. Cards: `<h3 class="fs-3"><a class="link-post" href=…>TITLE</a>`
      with the date in `<time …>October 21st, 2026</time>` (ordinal suffix). Articles
      carry JSON-LD datePublished. Many hits are `/daily-news-roundup/…` multi-story
      posts — open them only to find the ChatGPT Ads story and keep just that story's
      facts. Ad-tech trade press: lots of commentary, publisher-side and vendor news —
      filter hard (criteria.md → third-party rule).

  - key: searchengineland_chatgpt
    platform: chatgpt
    title: Search Engine Land — ChatGPT
    url: https://searchengineland.com/library/platforms/openai/chatgpt
    type: aggregator
    validation: blocked
    blocked_since: 2026-09-22
    note: >-
      Cloudflare challenge (see DOMAIN NOTES). When readable: mixes real ChatGPT Ads news
      with SEO / evergreen ChatGPT content — keep only ads-manager changes.

  # ── Meta ────────────────────────────────────────────────────────────────────
  - key: meta_newsroom_tech
    platform: meta
    title: Meta Newsroom — Technologies
    url: https://about.fb.com/news/category/technologies/
    type: official
    validation: readable
    note: >-
      Server-rendered newsroom; ~14 article links + JSON-LD dates. Filter HARD — most of
      it is consumer / policy / PR, not ads.

  - key: socialmediatoday_facebook
    platform: meta
    title: Social Media Today — Facebook
    url: https://www.socialmediatoday.com/topic/facebook/
    type: aggregator
    validation: readable
    note: See DOMAIN NOTES (Social Media Today). Keep only Meta Ads Manager changes.

  - key: socialmediatoday_instagram
    platform: meta
    title: Social Media Today — Instagram
    url: https://www.socialmediatoday.com/topic/instagram/
    type: aggregator
    validation: readable
    note: >-
      See DOMAIN NOTES (Social Media Today). Overlaps the Facebook topic heavily. Keep
      only Meta Ads Manager changes (Instagram placements, formats, ads targeting).

  - key: searchengineland_meta
    platform: meta
    title: Search Engine Land — Meta
    url: https://searchengineland.com/library/platforms/meta
    type: aggregator
    validation: blocked
    blocked_since: 2026-09-22
    note: Cloudflare challenge (see DOMAIN NOTES). When readable — ~55 article links.

  # ── TikTok ──────────────────────────────────────────────────────────────────
  - key: tiktok_ads_blog
    platform: tiktok
    title: TikTok for Business Blog — Announcements
    url: https://ads.tiktok.com/business/en/blog/category/Announcements
    type: official
    validation: readable
    note: >-
      Server-rendered (~1.3 MB page). ~12 cards, links `/business/en/blog/<slug>` with
      dates like `September 30, 2026`. Articles carry JSON-LD datePublished — use it; the
      "Published …" line in the body can show a different date. The category mixes
      product news with agency-partner programmes and research — filter per criteria.md.

  - key: socialmediatoday_tiktok
    platform: tiktok
    title: Social Media Today — TikTok
    url: https://www.socialmediatoday.com/topic/tiktok/
    type: aggregator
    validation: readable
    note: >-
      See DOMAIN NOTES (Social Media Today). Keep only TikTok Ads Manager changes; TikTok
      Shop seller tools count only where they change ads.

  - key: searchengineland_tiktok
    platform: tiktok
    title: Search Engine Land — TikTok
    url: https://searchengineland.com/library/platforms/tiktok
    type: aggregator
    validation: blocked
    blocked_since: 2026-09-22
    note: Cloudflare challenge (see DOMAIN NOTES). When readable — ~57 article links.

  # ── LinkedIn ────────────────────────────────────────────────────────────────
  - key: linkedin_ads_blog
    platform: linkedin
    title: LinkedIn Marketing Blog — LinkedIn Ads
    url: https://www.linkedin.com/business/marketing/blog/linkedin-ads
    type: official
    validation: readable
    note: >-
      ~13 links `/business/marketing/blog/<category>/<slug>` with index dates like
      `Sep 28, 2026`; the first card is a pinned evergreen post (dated 2025), which the
      window drops. Article pages carry no JSON-LD date — use the index date. ~2 posts a
      month, mostly tips and guides — filter hard to Campaign Manager changes.

  - key: socialmediatoday_linkedin
    platform: linkedin
    title: Social Media Today — LinkedIn
    url: https://www.socialmediatoday.com/topic/linkedin/
    type: aggregator
    validation: readable
    note: >-
      See DOMAIN NOTES (Social Media Today). Keep only Campaign Manager changes (ad
      formats, targeting, reporting); most LinkedIn coverage here is organic.

  # ── Multi-platform ──────────────────────────────────────────────────────────
  - key: ppcland_pulse
    platform: mixed
    scope: all
    title: PPC Land — Pulse
    url: https://ppc.land/tag/pulse/
    type: aggregator
    validation: readable
    note: >-
      PPC Land's news section. Cards are `<article class="card card-post …">`: title in
      the `aria-label` and link in the `href` of `<a class="card-post-image-link">`, date
      in `<time class="card-post-date" datetime="YYYY-MM-DD">`. 12 cards per page, ~2
      pages per day — page back through `/tag/pulse/page/N/` (~30–35 pages for the
      window) until the cards precede window_start. Broad ad-industry news (CTV, retail
      media, privacy, M&A, ad tech): screen the card titles to discard what is plainly
      not about our six platforms, then open every remaining candidate. Watch for Google
      products that are not Google Ads (DV360, CM360, SA360, Ad Manager) — criteria.md →
      product test. Articles carry JSON-LD datePublished.

  - key: ppcnewsfeed
    platform: mixed
    scope: search
    title: PPC News Feed
    url: https://ppcnewsfeed.com/ppc-news/
    type: aggregator
    validation: readable
    note: >-
      PPC-only news (mostly Google Ads + Microsoft Advertising). WordPress: 10 cards per
      page, `<article class="post-… tag-google-ads tag-microsoft-advertising …">` (platform
      tags in the class), title + link in `<h2 class="cs-entry__title"><a href=…>`, date in
      `<div class="cs-meta-date">October 21, 2026</div>`. ~3–4 posts a day — page back
      through `/ppc-news/page/N/` (~6 pages for the window). Use /ppc-news/, not the
      homepage: the homepage's `/page/N/` just repeats page 1. Posts are short rewrites of
      official announcements and usually link the official page; articles carry JSON-LD
      datePublished.

  - key: sej_ppc
    platform: mixed
    scope: search
    title: Search Engine Journal — PPC
    url: https://www.searchenginejournal.com/category/news/?ver=pay-per-click
    type: aggregator
    validation: readable
    note: >-
      SEJ news filtered to PPC. Cards are `<article data-l="News" …>` with links
      `/<slug>/<id>/` and the date in `<span class="entrydate">Oct 14, 2026</span>`; the
      first link on the page is a pinned evergreen article — ignore it. Low volume (~1
      post a week), so page 1 covers months. Articles carry JSON-LD datePublished.

  - key: sej_social
    platform: mixed
    scope: social
    title: Search Engine Journal — Social
    url: https://www.searchenginejournal.com/category/news/?ver=social
    type: aggregator
    validation: readable
    note: >-
      SEJ news filtered to social; same structure as sej_ppc. Mostly YouTube, Reddit and
      organic-social stories — keep only Meta / TikTok / LinkedIn ads-manager changes.
