<title>Ad Platform News Digest</title>
<!--
  ZINE DECK TEMPLATE — used by Routine 2 (Presentation).

  HOW ROUTINE 2 USES THIS FILE:
    1. Copy this file to decks/deck-YYYY-MM-DD.html
    2. Replace the single line  <script id="deck-data" ...> ... </script>
       with a filled-in DECK_DATA object (schema documented in that block below).
    3. Nothing else needs editing. All rendering is data-driven.

  Not zero-request: this skin pulls Playfair Display + Courier Prime from Google
  Fonts CDN and reads sticker PNGs from ../assets/stickers/ (repo-relative, works
  identically from style/ and from decks/ since both sit one level below repo
  root). It also loads Google Tag Manager (container GTM-M2BTR42L) for analytics,
  and pushes a `link_click` event to the dataLayer on every <a> click (for GTM
  triggers). Those are the only third-party requests — do not add other analytics
  or third-party JS/CSS. Fine to serve from GitHub Pages and to print to PDF.

  No dark-mode variant — this skin is a light/cream editorial look by design
  (see the Claude Design "Zine" direction it implements); it does not adapt to
  prefers-color-scheme like the previous template did.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --aid-blue:     rgb(0, 9, 220);
    --aid-blue-50:  rgb(245, 245, 254);
    --aid-ink:      rgb(11, 11, 11);
    --aid-slate:    rgb(51, 52, 74);
    --aid-mute:     rgb(128, 128, 142);
    --aid-pink:     rgb(240, 52, 142);
    --aid-lime:     rgb(174, 243, 62);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{margin:0;background:#f4f1ea;color:var(--aid-ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--aid-blue);text-decoration:none}
  a:hover{opacity:.78}
  ::selection{background:var(--aid-lime)}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}}
  .card-hov{transition:transform .18s ease, box-shadow .18s ease}
  .card-hov:hover{transform:translate(-2px,-2px)}
  .lnk-underline{background-image:linear-gradient(var(--aid-blue),var(--aid-blue));background-size:0% 2px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .25s ease}
  .lnk-underline:hover{background-size:100% 2px;opacity:1}
  .empty{color:var(--aid-mute);font-style:italic}
  @media print{
    header[style*="sticky"]{position:static}
    img[style*="floaty"]{animation:none}
  }

  /* ── Header controls: news filter + language (shared dropdown chrome) ──
     Both controls are pills of the same family. The language pill is always a
     dropdown; the news filter is the original segmented slider on desktop
     (≥641px) and collapses to the same dropdown pill on phones, so the header
     keeps a fixed, compact footprint however many filters we add later. */
  .hdr-ctl{display:flex;align-items:center;gap:10px;flex:none}
  .dd{position:relative;flex:none}
  /* Height is set explicitly (not left to font metrics) so the pill matches the
     desktop filter slider exactly whether or not the webfont has loaded. The 1px
     of top-only padding optically centres the label: uppercase has no descenders,
     so a strictly box-centred line reads as sitting high. */
  .dd-toggle{display:inline-flex;align-items:center;gap:7px;height:36px;border:2px solid var(--aid-ink);border-radius:999px;background:#fff;cursor:pointer;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aid-ink);padding:1px 13px 0;line-height:1;white-space:nowrap;transition:background .18s}
  .dd-toggle:hover{background:var(--aid-lime)}
  .dd-car{font-size:9px;line-height:1;transition:transform .22s}
  .dd.open .dd-car{transform:rotate(180deg)}
  /* Frosted-glass popup. It is position:fixed and gets moved to <body> when it
     opens — see openPanel() below. The header sets its own backdrop-filter, which
     makes it a backdrop root, and a backdrop-filter nested inside one samples an
     empty backdrop: the popup would render with no blur at all. Living on <body>
     while open puts it back over the real page content. */
  .opts{position:fixed;z-index:80;display:none;flex-direction:column;gap:2px;padding:6px;border:2px solid var(--aid-ink);border-radius:16px;background:rgba(255,255,255,.55);backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);box-shadow:4px 5px 0 rgba(26,26,26,.16)}
  .opts.open{display:flex}
  .opts button{display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aid-ink);padding:8px 12px;border-radius:999px;white-space:nowrap;text-align:left;transition:background .15s,color .15s}
  .opts button:hover{background:rgba(43,90,224,.14)}
  .opts button.active{background:var(--aid-blue);color:#fff}
  .flt-ind{display:none}
  /* Desktop: the news filter goes back to being a segmented slider — its panel
     stays in place (never portaled) because its toggle is hidden here. */
  @media (min-width:641px){
    #news-filter{display:inline-flex;height:36px;border:2px solid var(--aid-ink);border-radius:999px;background:#fff;padding:3px}
    #news-filter>.dd-toggle{display:none}
    #news-filter .opts{position:relative;z-index:auto;display:inline-flex;flex-direction:row;gap:0;padding:0;border:0;border-radius:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
    #news-filter .opts button{position:relative;z-index:1;height:100%;padding:6px 14px;transition:color .2s}
    #news-filter .opts button:hover{background:transparent}
    #news-filter .opts button.active{background:transparent;color:#fff}
    #news-filter .flt-ind{display:block;position:absolute;left:0;top:0;bottom:0;z-index:0;border-radius:999px;background:var(--aid-blue);transition:transform .3s cubic-bezier(.5,1.5,.4,1),width .3s cubic-bezier(.5,1.5,.4,1)}
  }
  /* ── Typewriter caret ── */
  .tw-caret::after{content:"";display:inline-block;width:.055em;height:.92em;background:currentColor;margin-left:.05em;vertical-align:-.06em;animation:tw-blink .8s steps(1) infinite}
  @keyframes tw-blink{50%{opacity:0}}
  /* ── Sticker entrance (uses `scale` so it won't fight the floaty transform) ── */
  img.stk-in{opacity:0;scale:.5;transition:opacity .5s ease,scale .6s cubic-bezier(.34,1.56,.64,1)}
  img.stk-in.shown{opacity:1;scale:1}
  /* ── Section reveal (smooth top-to-bottom) ── */
  .reveal{opacity:0;translate:0 18px;transition:opacity .6s ease,translate .6s cubic-bezier(.22,1,.36,1)}
  .reveal.shown{opacity:1;translate:0 0}
  @media (prefers-reduced-motion: reduce){
    img.stk-in,img.stk-in.shown{opacity:1;scale:1;transition:none}
    .reveal,.reveal.shown{opacity:1;translate:0 0;transition:none}
    .tw-caret::after{display:none}
  }
  /* ── Mobile polish (phones only; desktop ≥641px is untouched) ── */
  @media (max-width:640px){
    /* The large floating stickers are positioned for the wide layout and cover
       text on narrow screens — hide them here. Inline heading/card stickers stay. */
    #dec-hero-1,#dec-hero-2,#dec-tldr,#dec-signoff-1,#dec-signoff-2{display:none}
    /* Center the footer credits instead of stretching them edge-to-edge. */
    footer>div{flex-direction:column;text-align:center}
    /* Tighter side gutters + block padding so cards/headings don't hug the edge. */
    body section,body main,body header>div,footer>div{padding-left:20px!important;padding-right:20px!important}
    #d-tldr-wrap{padding:26px 22px!important}
    .signoff-card{padding:40px 26px!important}
    /* Sign-off heading: smaller on phones and let both sentences flow together
       (drop the forced break) so it fills ~2 lines instead of 4. */
    .signoff-card h2{font-size:clamp(20px,5.2vw,25px)!important;line-height:1.2!important}
    .signoff-card h2 br{display:none}
    /* Header: keep the brand on the LEFT and the filter on the RIGHT in one row
       (like desktop). Compact the filter and let the brand wrap to 2–3 lines so
       both fit on narrow phones without running off the edge. */
    header>div>div:first-child{min-width:0}
    header>div>div:first-child span:last-child{font-size:11px;letter-spacing:.09em;line-height:1.25}
    /* Both header controls are dropdown pills here — see the .dd rules above.
       Shorter pill (30px), same explicit height + 1px top bias as desktop. */
    .hdr-ctl{gap:7px}
    .dd-toggle{height:30px;padding:1px 10px 0;gap:5px;letter-spacing:.02em}
    /* TL;DR: one column on phones — two columns squeeze each bullet into a narrow
       ribbon of text that is hard to read. */
    #d-tldr{grid-template-columns:1fr!important;gap:14px!important}
  }
</style>
</head>

<!-- ─────────────────────────────────────────────────────────────────────────
     DECK_DATA — Routine 2 replaces the contents of this script block.
     Required (unchanged from the previous template):
     {
       "period_label": "Jul 7 – Jul 21, 2026",   // window covered
       "generated": "2026-07-21",                  // ISO date deck was built
       "tldr": ["one-line highlight", "..."],      // 3–5 bullets, most important first
       "platforms": [                              // ordered; empty ones omitted
         {
           "name": "Google Ads",
           "items": [
             {
               "title": "…",
               "url": "https://…",
               "source": "Google Ads & Commerce Blog",
               "published": "2026-07-14",
               "category": "feature",              // feature|beta|policy|deprecation|measurement|api|other
               "impact": "high",                   // high|medium|low
               "summary": "2–3 sentences."
             }
           ]
         }
       ]
     }
     Items within a platform should be ordered high -> medium -> low impact.

     Optional (new in this skin — omit any/all, the deck degrades gracefully):
       "edition_no":     14,                    // shown as "No. 14 · <period_label>"; omitted -> just period_label
       "subtitle":       "…",                   // hero subhead; falls back to "Updates published <period_label>"
       "read_minutes":   5,                     // falls back to an estimate from item count
       "author":         "Ivan Potekhin",       // footer credit; falls back to "Ivan Potekhin"
       "archive":        [{ "no":13,"label":"Jun 22 – Jul 5","url":"deck-2026-07-05.html" }]  // past-editions strip; BARE filename (no decks/ prefix); omitted -> section hidden

     TRANSLATIONS (optional; the header language pill offers EN / RU / ES / SR).
     English is the base language and is always what `subtitle`/`title`/`summary`/
     `tldr` hold. Routine 2 pre-translates at build time — there is no runtime
     API — and supplies EXACTLY FOUR things per language: the hero subtitle, card
     titles, card summaries and TL;DR bullets. Everything else on the page is
     fixed English chrome. Serbian is written in LATIN script (`sr`). A missing
     language, item or field silently falls back to English, so pre-i18n decks
     still render.
       "subtitle_i18n": { "ru":"…", "es":"…", "sr":"…" }
       "tldr_i18n":     { "ru":[ … ], "es":[ … ], "sr":[ … ] }  // same count & order as "tldr"
       …and on each item:
       "i18n": { "ru":{"title":"…","summary":"…"}, "es":{…}, "sr":{…} }
     Deep link with ?lang=ru|es|sr. The URL is the ONLY source of language (same
     as ?team=): no param — or ?lang=en — always opens in English, and nothing is
     stored, so a shared link renders the same for everyone who opens it.
  ────────────────────────────────────────────────────────────────────────── -->
  <script id="deck-data" type="application/json">
{
  "period_label": "Jul 22 – Aug 5, 2026",
  "generated": "2026-08-05",
  "edition_no": 1,
  "author": "Ivan Potekhin",
  "subtitle": "Inventory controls, AI labels and a Local Services migration — the fortnight's changes that touch live campaigns.",
  "tldr": [
    "Local Services Ads become a pay-per-lead Performance Max campaign type inside Google Ads from August — the migration is automatic, manual bidding ends, and historical LSA reports are lost unless exported first.",
    "A Performance Max alpha finally lets selected advertisers untick Search Partners and the Display Network, the inventory control PMax buyers have asked for since launch.",
    "Microsoft is retiring Predictive Matching and folding it into AI Max search-term matching — no date given, so watch accounts that lean on it.",
    "Meta's Graph/Marketing API v26.0 blocks 47 commerce endpoints and drops the Instagram Explore Feed placement, Messenger Stories targeting and new poll creatives.",
    "Google adds AI content labels for creatives (EU, India, New York) and, separately, ends in-account appeals for policy decisions older than six months."
  ],
  "platforms": [
    {
      "name": "Google Ads",
      "items": [
        {
          "title": "July's Demand Gen Drop expands Checkout Links to nine markets and upgrades tROAS bidding",
          "url": "https://blog.google/products/ads-commerce/demand-gen-drop-july-2026/",
          "source": "Google Ads & Commerce Blog",
          "published": "2026-07-29",

<script>
(function(){
  var data;
  try { data = JSON.parse(document.getElementById('deck-data').textContent); }
  catch(e){ data = {period_label:'(invalid deck data)', tldr:[], platforms:[]}; }

  var CAT = { feature:"Feature", beta:"Beta", policy:"Policy", deprecation:"Deprecation", measurement:"Measurement", api:"API", other:"Update" };
  var IMP = {
    high:   { label:"High",   bg:"var(--aid-pink)", fg:"#fff",            shadow:"var(--aid-blue)" },
    medium: { label:"Medium", bg:"var(--aid-blue)", fg:"#fff",            shadow:"var(--aid-pink)" },
    low:    { label:"Low",    bg:"#ffffff",         fg:"var(--aid-slate)", shadow:"var(--aid-lime)" }
  };
  // ── Stickers: randomized per edition, deterministic (same deck → same layout) ──
  // Positions & sizes of every sticker slot are fixed; only WHICH png lands in each
  // slot is shuffled, seeded off the edition date, so nothing shifts. Pools below
  // control which stickers may appear where (some families clash or are reserved).
  //   - arrows-grid / flag: not used anywhere (removed).
  //   - folder-star: only in the "THAT'S A WRAP" block (dark-blue bg).
  //   - paperclip: only in the HERO (section:nth-child(2)) and the WRAP block; never in cards.
  var STK = "../assets/stickers/";
  // General pool — no arrows-grid / flag / folder-star / paperclip.
  var POOL_GENERAL = ["bandage-formula-pink.png","blob-face-blue.png","blob-face-green.png","blob-face-pink.png","brain-star-blue.png","brain-star-green.png","brain-star-pink.png","document-sparkle-blue.png","document-sparkle-green.png","document-sparkle-pink.png","globe-blue-pink.png","globe-green-blue.png","globe-pink-blue.png","hand-raised-blue-green.png","hand-raised-pink-blue.png","hand-raised-pink-green.png","rainbow.png","shooting-star-blue.png","shooting-star-green.png","shooting-star-pink.png","sleepy-dome-blue.png","sleepy-dome-green.png","sleepy-dome-pink.png","thumbs-up-blue-pink.png","thumbs-up-green-blue.png","thumbs-up-green-pink.png","todo-notepad-blue.png","todo-notepad-green.png","todo-notepad-pink.png"];
  var PAPERCLIP = ["paperclip-blue-pink.png","paperclip-green-blue.png","paperclip-green-pink.png"];
  var POOL_HERO  = POOL_GENERAL.concat(PAPERCLIP);   // hero may use paperclip
  var POOL_CARDS = POOL_GENERAL;                      // cards: no paperclip
  // Only these read well on the dark-blue "THAT'S A WRAP" background.
  var POOL_WRAP = ["bandage-formula-pink.png","blob-face-green.png","blob-face-pink.png","brain-star-green.png","brain-star-pink.png","document-sparkle-green.png","document-sparkle-pink.png","folder-star-green.png","folder-star-pink.png","globe-green-blue.png","globe-pink-blue.png","hand-raised-blue-green.png","hand-raised-pink-green.png","paperclip-green-pink.png","rainbow.png","shooting-star-green.png","shooting-star-pink.png","sleepy-dome-green.png","sleepy-dome-pink.png","thumbs-up-green-blue.png","thumbs-up-green-pink.png"];
  // Platform-heading icons stay meaningful (a shape per platform), but the colour varies.
  var FAM = {
    globe:  ["globe-blue-pink.png","globe-green-blue.png","globe-pink-blue.png"],
    notepad:["todo-notepad-blue.png","todo-notepad-green.png","todo-notepad-pink.png"],
    doc:    ["document-sparkle-blue.png","document-sparkle-green.png","document-sparkle-pink.png"]
  };
  var PF_FAM = [{k:"linkedin",f:"notepad"},{k:"tiktok",f:"doc"},{k:"meta",f:"globe"},{k:"facebook",f:"globe"},{k:"microsoft",f:"globe"},{k:"bing",f:"globe"},{k:"google",f:"globe"},{k:"chatgpt",f:"doc"},{k:"openai",f:"doc"}];
  function hashStr(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var SEED = String((typeof data!=="undefined" && (data.generated||data.period_label)) || "seed");
  var _rng = mulberry32(hashStr(SEED));
  function pickFrom(pool){ return STK + pool[Math.floor(_rng()*pool.length)]; }
  // Social = Meta / TikTok / LinkedIn; everything else (Google Ads, Microsoft/Bing,
  // ChatGPT Ads, …) belongs to the Search team.
  function teamOf(name){var n=(name||"").toLowerCase();return (n.indexOf("meta")>=0||n.indexOf("tiktok")>=0||n.indexOf("linkedin")>=0||n.indexOf("facebook")>=0)?"social":"search";}
  function iconFor(name){
    var n=(name||"").toLowerCase(), fam="globe";
    for(var i=0;i<PF_FAM.length;i++){ if(n.indexOf(PF_FAM[i].k)>=0){ fam=PF_FAM[i].f; break; } }
    return pickFrom(FAM[fam]);
  }
  // Assign the fixed decorative slots from their allowed pools (image swaps; position/size untouched).
  var SLOT_POOL = { "dec-tldr":POOL_GENERAL, "dec-archive":POOL_GENERAL };
  // Base "type" of a sticker = filename minus trailing colour tokens
  // (blob-face-green -> blob-face, paperclip-green-pink -> paperclip, globe-blue-pink -> globe).
  function stkType(file){ return file.replace(/\.png$/,"").replace(/(-(?:green|pink|blue))+$/,""); }
  function pickFile(pool){ return pool[Math.floor(_rng()*pool.length)]; }
  // Pick a file whose type differs from avoidType (fall back to any after a few tries).
  function pickFileDistinct(pool, avoidType){
    for(var k=0;k<16;k++){ var f=pickFile(pool); if(stkType(f)!==avoidType){ return f; } }
    return pickFile(pool);
  }
  // Paired decorative slots (two stickers shown together) must be DIFFERENT types — never
  // e.g. two smileys or two to-do lists, even in different colours. Still random per edition.
  function assignPair(id1, id2, pool){
    var f1=pickFile(pool), n1=document.getElementById(id1); if(n1){ n1.src=STK+f1; }
    var f2=pickFileDistinct(pool, stkType(f1)), n2=document.getElementById(id2); if(n2){ n2.src=STK+f2; }
  }
  assignPair("dec-hero-1","dec-hero-2",POOL_HERO);         // hero (section:nth-child(2))
  assignPair("dec-signoff-1","dec-signoff-2",POOL_WRAP);   // sign-off (section:nth-child(6))
  // Single decorative slots — any sticker from their pool.
  Object.keys(SLOT_POOL).forEach(function(id){
    var n=document.getElementById(id); if(n){ n.src = pickFrom(SLOT_POOL[id]); }
  });

  function el(tag, style){
    var node = document.createElement(tag);
    if (style) for (var k in style) node.style[k] = style[k];
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child == null || child === false) continue;
      node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);

    return node;
  }
  function img(src, style){
    var i = document.createElement("img");
    i.src = src; i.alt = "";
    if (style) for (var k in style) i.style[k] = style[k];
    return i;
  }

  // ── Language (i18n) ──────────────────────────────────────────────────────
  // Only FOUR things are translated: the hero subtitle, card titles, card
  // summaries and TL;DR bullets. Everything else — brand, filters, hero
  // headline, dates, counters, platform names, category/impact chips, card
  // meta, archive, sign-off, footer — is pre-baked English chrome and is
  // never regenerated.
  //   item.i18n         = { ru:{title,summary}, es:{…}, sr:{…} }
  //   data.tldr_i18n     = { ru:[…], es:[…], sr:[…] }
  //   data.subtitle_i18n = { ru:"…", es:"…", sr:"…" }
  // All optional: a missing language (or field) falls back to the English
  // base, so decks built before i18n keep rendering unchanged.
  var LANGS = ["en","ru","es","sr"];
  function txt(it, field, lang){
    if(lang !== "en" && it.i18n && it.i18n[lang] && it.i18n[lang][field]) return it.i18n[lang][field];
    return it[field] || "";
  }
  function tldrFor(lang){
    if(lang !== "en" && data.tldr_i18n && data.tldr_i18n[lang] && data.tldr_i18n[lang].length) return data.tldr_i18n[lang];
    return data.tldr || [];
  }
  function subtitleFor(lang){
    if(lang !== "en" && data.subtitle_i18n && data.subtitle_i18n[lang]) return data.subtitle_i18n[lang];
    return data.subtitle || (data.period_label ? ("Updates published " + data.period_label) : "");
  }
  // Language comes from ?lang= ONLY — exactly like ?team=. No stored preference:
  // a plain link (no param) always opens in English, so the URL alone decides
  // what a reader sees and a shared link never renders differently for them.
  function resolveLang(){
    try { var q = new URLSearchParams(window.location.search).get("lang");
          if(q && LANGS.indexOf(q.toLowerCase()) >= 0) return q.toLowerCase(); } catch(e){}
    return "en";
  }

  var platforms = (data.platforms || []).filter(function(p){ return p.items && p.items.length; });
  var total = platforms.reduce(function(a, p){ return a + p.items.length; }, 0);

  // Hero
  var badge = data.edition_no
    ? "● No. " + data.edition_no + " · " + (data.period_label || "")
    : "● " + (data.period_label || "");
  document.getElementById("d-badge").textContent = badge;

  document.getElementById("stat-updates").textContent = total;
  document.getElementById("stat-platforms").textContent = platforms.length;
  document.getElementById("stat-readmin").textContent =
    data.read_minutes || Math.max(2, Math.round(total * 0.5));

  // ── Content render (language-aware) ──────────────────────────────────────
  // Everything a reader can re-translate is built here, so switching language
  // just re-runs this function; the chrome above is written once. The sticker
  // RNG is re-seeded from a fixed sub-seed at the top of every run, so card
  // stickers and platform icons are identical in all four languages.
  var tldrList = document.getElementById("d-tldr");
  var body = document.getElementById("d-body");

  function renderContent(lang){
  _rng = mulberry32(hashStr(SEED + "|body"));
  document.documentElement.lang = lang;
  tldrList.textContent = "";
  body.textContent = "";

  // Hero subtitle (the one line of hero copy that IS translated)
  document.getElementById("d-subtitle").textContent = subtitleFor(lang);

  // TL;DR
  var bullets = tldrFor(lang);
  if (bullets.length) {
    document.getElementById("d-tldr-wrap").style.display = "";
    bullets.forEach(function(text, i){
      tldrList.appendChild(
        el("li", { display:"flex", gap:"14px", alignItems:"flex-start", color:"var(--aid-ink)", fontSize:"16px", lineHeight:"1.5" },
          el("span", { flex:"none", fontFamily:"'Playfair Display',serif", fontWeight:"800", fontSize:"22px", color:"var(--aid-blue)", lineHeight:"1.25" }, String(i + 1).padStart(2, "0")),
          el("span", null, text)
        )
      );
    });
  } else {
    document.getElementById("d-tldr-wrap").style.display = "none";
  }

  // Updates, grouped by platform
  if (!platforms.length) {
    body.appendChild(el("p", { color:"var(--aid-mute)", fontStyle:"italic" }, "No qualifying updates in this period."));
  }
  platforms.forEach(function(pf){
    var heading = el("div", { display:"flex", alignItems:"center", flexWrap:"wrap", gap:"14px", marginBottom:"24px" },
      (function(){var _pi=img(iconFor(pf.name),{width:"46px",flex:"none",filter:"drop-shadow(0 6px 10px rgba(0,0,0,.14))"});_pi.className="pf-icon";return _pi;})(),
      el("h2", { fontFamily:"'Playfair Display',Georgia,serif", fontWeight:"800", fontSize:"38px", lineHeight:"1", margin:"0", color:"var(--aid-ink)" }, pf.name),
      el("span", { fontFamily:"'Courier Prime',monospace", fontSize:"13px", color:"var(--aid-ink)", background:"#fff", border:"2px solid var(--aid-ink)", borderRadius:"999px", padding:"3px 12px", fontWeight:"700", whiteSpace:"nowrap", flex:"none" }, pf.items.length + (pf.items.length === 1 ? " update" : " updates")),
      el("span", { flex:"1", height:"2px", background:"var(--aid-ink)", opacity:".14" })
    );

    var grid = el("div", { display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(min(340px,100%),1fr))", gap:"22px" });

    pf.items.forEach(function(it, i){
      var imp = IMP[(it.impact || "low").toLowerCase()] || IMP.low;
      // Sticker on every 3rd card (fixed rhythm, not impact-driven). Which PNG lands
      // there is still seeded-random per edition via pickFrom.
      var wantSticker = (i % 3 === 1);
      var stickerSrc = wantSticker ? pickFrom(POOL_CARDS) : null;
      var bg = (i % 2 === 1) ? "var(--aid-blue-50)" : "#ffffff";

      var link = el("a", { color:"inherit" }, txt(it, "title", lang));
      link.href = it.url || "#";
      link.target = "_blank";
      link.rel = "noopener";

      var card = el("article", { background:bg, border:"2px solid var(--aid-ink)", borderRadius:"18px", padding:"26px 26px 22px", boxShadow:"7px 8px 0 " + imp.shadow, position:"relative" },
        stickerSrc ? img(stickerSrc, { position:"absolute", right:"18px", top:"-26px", width:"66px", "--r":"7deg", animation:"floaty 5s ease-in-out infinite", filter:"drop-shadow(0 6px 9px rgba(0,0,0,.18))" }) : null,
        el("div", { display:"flex", gap:"8px", marginBottom:"14px", flexWrap:"wrap" },
          el("span", { fontFamily:"'Courier Prime',monospace", fontSize:"10.5px", letterSpacing:".06em", textTransform:"uppercase", color:"var(--aid-ink)", background:"#fff", border:"1.5px solid var(--aid-ink)", borderRadius:"7px", padding:"3px 10px" }, CAT[it.category] || CAT.other),
          el("span", { fontFamily:"'Courier Prime',monospace", fontSize:"10.5px", letterSpacing:".06em", textTransform:"uppercase", color:imp.fg, background:imp.bg, border:"1.5px solid var(--aid-ink)", borderRadius:"7px", padding:"3px 10px" }, imp.label)
        ),
        el("h3", { fontFamily:"'Playfair Display',Georgia,serif", fontWeight:"700", fontSize:"23px", lineHeight:"1.14", margin:"0 0 12px", color:"var(--aid-ink)" }, link),
        el("p", { margin:"0", fontSize:"14.5px", lineHeight:"1.56", color:"var(--aid-slate)" }, txt(it, "summary", lang)),
        el("div", { fontFamily:"'Courier Prime',monospace", fontSize:"11px", color:"var(--aid-mute)", marginTop:"16px", display:"flex", gap:"8px", alignItems:"center" },
          el("span", { color:"var(--aid-blue)" }, "↳"), el("span", null, it.published || ""), el("span", null, "·"), el("span", null, it.source || "")
        )
      );
      card.className = "card-hov";
      grid.appendChild(card);
    });

    var _sec=el("section",{marginBottom:"56px"},heading,grid);_sec.className="reveal";_sec.setAttribute("data-team",teamOf(pf.name));body.appendChild(_sec);
  });

  // Lets the chrome script re-apply the team filter and show the new nodes.
  document.dispatchEvent(new CustomEvent("deck:rendered", { detail:{ lang:lang } }));
  }

  var initialLang = resolveLang();
  renderContent(initialLang);
  // Handed to the chrome script below (which owns the header dropdowns).
  window.__deck = { render: renderContent, langs: LANGS, lang: initialLang };

  // Archive (optional)
  if (data.archive && data.archive.length) {
    document.getElementById("d-archive-section").style.display = "";

    data.archive.forEach(function(a){
      var link = el("a", { fontFamily:"'Courier Prime',monospace", fontSize:"12.5px", color:"var(--aid-ink)", background:"#fff", border:"2px solid var(--aid-ink)", borderRadius:"12px", padding:"12px 18px", boxShadow:"3px 3px 0 var(--aid-ink)", display:"flex", flexDirection:"column", gap:"3px" },
        el("span", { fontWeight:"700" }, "No. " + a.no),
        el("span", { color:"var(--aid-mute)" }, a.label)
      );
      link.href = a.url || "#";
      archiveList.appendChild(link);
    });
  }

  document.getElementById("d-footer").textContent =
    total + " update" + (total === 1 ? "" : "s") + " · " + (data.period_label || "") + " · Made for Performance Team with 💜 by " + (data.author || "Ivan Potekhin");

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── Header dropdowns ──
  // One open at a time; click outside or Esc closes. On desktop the news filter
  // renders as a segmented slider and its toggle is hidden, so this only drives
  // the language pill there; on phones it drives both.
  var openDD=null;
  function panelFor(dd){ if(!dd.__panel) dd.__panel=dd.querySelector(".opts"); return dd.__panel; }
  function closeDD(){
    if(!openDD) return;
    var dd=openDD, panel=panelFor(dd);
    panel.classList.remove("open");
    panel.style.cssText="";                       // drop the fixed-position placement
    if(panel.parentNode!==dd) dd.appendChild(panel);   // return it to its control
    dd.classList.remove("open");
    var t=dd.querySelector(".dd-toggle"); if(t) t.setAttribute("aria-expanded","false");
    openDD=null;
  }
  function openPanel(dd){
    var panel=panelFor(dd), tog=dd.querySelector(".dd-toggle");
    // Move the panel onto <body> before showing it. The sticky header has its own
    // backdrop-filter, and a backdrop-filter nested inside another one sees an empty
    // backdrop — the popup would show zero blur. On <body> it frosts the real page.
    if(panel.parentNode!==document.body) document.body.appendChild(panel);
    var r=tog.getBoundingClientRect();
    panel.style.position="fixed";
    panel.style.top=(r.bottom+9)+"px";
    panel.style.right=(window.innerWidth-r.right)+"px";
    panel.style.minWidth=r.width+"px";
    panel.classList.add("open");
    dd.classList.add("open");
    tog.setAttribute("aria-expanded","true");
    openDD=dd;
  }
  document.addEventListener("click", function(e){
    if(!e.target.closest) return;
    var tog=e.target.closest(".dd-toggle");
    if(tog){
      var dd=tog.closest(".dd"), wasOpen=(openDD===dd);
      closeDD();
      if(!wasOpen) openPanel(dd);
      return;
    }
    // An open panel lives on <body>, so "inside" means inside .opts, not inside .dd.
    if(!e.target.closest(".opts")) closeDD();
  });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeDD(); });
  // The placement is a one-shot measurement, so anything that moves the toggle
  // closes the panel rather than leaving it stranded.
  window.addEventListener("scroll", closeDD, true);

  // ?team= / ?lang= stay in the address bar so a reader can copy the link they see.
  function setParam(key, val, dflt){
    if(!(window.history && history.replaceState)) return;
    try{
      var u=new URL(window.location.href);
      if(val===dflt){ u.searchParams.delete(key); } else { u.searchParams.set(key, val); }
      history.replaceState(null,"",u.toString());
    }catch(e){}
  }

  // News filter
  var filter=document.getElementById("news-filter");
  var curTeam="all";
  if(filter){
    var opts=filter.querySelector(".opts");
    var btns=[].slice.call(filter.querySelectorAll(".flt"));
    var fcur=filter.querySelector(".dd-cur");
    var ind=document.createElement("div"); ind.className="flt-ind"; opts.insertBefore(ind, opts.firstChild);
    function moveInd(btn){ ind.style.width=btn.offsetWidth+"px"; ind.style.transform="translateX("+btn.offsetLeft+"px)"; }
    function apply(team){
      var secs=[].slice.call(document.querySelectorAll('#d-body > section'));
      secs.forEach(function(s){ s.style.display=(team==="all"||s.getAttribute("data-team")===team)?"":"none"; });
      var vis=secs.filter(function(s){return s.style.display!=="none";});
      var items=0; vis.forEach(function(s){ items+=s.querySelectorAll('article').length; });
      var su=document.getElementById('stat-updates'); if(su) su.textContent=items;
      var sp=document.getElementById('stat-platforms'); if(sp) sp.textContent=vis.length;
    }
    function btnFor(team){ for(var i=0;i<btns.length;i++){ if(btns[i].getAttribute("data-team")===team) return btns[i]; } return null; }
    function select(team, updateURL){
      var b=btnFor(team); if(!b) return;
      curTeam=team;
      btns.forEach(function(x){x.classList.remove("active");}); b.classList.add("active");
      moveInd(b); if(fcur) fcur.textContent=b.textContent; apply(team);
      if(updateURL) setParam("team", team, "all");
    }
    btns.forEach(function(b){ b.addEventListener("click", function(){ select(b.getAttribute("data-team"), true); closeDD(); }); });
    // Deep link: ?team=search|social (|all) opens the deck with that filter pre-applied.
    // Routine 2 uses this to send each team a link straight to its own view; readers
    // can switch to All news in the header. Unknown/absent value falls back to "all".
    var want="all";
    try{ var q=new URLSearchParams(window.location.search).get("team"); if(q){ q=q.toLowerCase(); if(q==="search"||q==="social"||q==="all"){ want=q; } } }catch(e){}
    requestAnimationFrame(function(){ select(want, false); });
    // A language switch rebuilds #d-body, so re-apply the current filter to it.
    document.addEventListener("deck:rendered", function(){ apply(curTeam); });
    window.addEventListener("resize", function(){ closeDD(); var a=filter.querySelector(".flt.active"); if(a) moveInd(a); });
  }

  // Language switcher — swaps card titles/summaries + TL;DR bullets (see the
  // render script above); every other string on the page stays English.
  var langDD=document.getElementById("lang-dd");
  if(langDD && window.__deck){
    var lbtns=[].slice.call(langDD.querySelectorAll(".lng"));
    var lcur=langDD.querySelector(".dd-cur");
    function selectLang(lang, rerender){
      var b=null;
      lbtns.forEach(function(x){ var on=x.getAttribute("data-lang")===lang; x.classList.toggle("active",on); if(on) b=x; });
      if(!b) return;
      if(lcur) lcur.textContent=b.textContent;
      if(rerender){
        window.__deck.render(lang);
        setParam("lang", lang, "en");   // URL only — the choice is not stored
      }
    }
    lbtns.forEach(function(b){ b.addEventListener("click", function(){ selectLang(b.getAttribute("data-lang"), true); closeDD(); }); });
    selectLang(window.__deck.lang, false);   // first render already used this language
  }

  // Sticker entrance (exclude platform icons and always-static stickers like Past editions)
  var stickers=[].slice.call(document.querySelectorAll("img")).filter(function(i){ return !i.classList.contains("pf-icon") && !i.classList.contains("stk-static"); });
  if(reduce || !("IntersectionObserver" in window)){ stickers.forEach(function(i){ i.classList.add("stk-in","shown"); }); }
  else {
    stickers.forEach(function(i){ i.classList.add("stk-in"); });
    // Wide, randomized delay so stickers in view pop in one-by-one (chaotic), not all at once.
    var so=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ var t=e.target; setTimeout(function(){t.classList.add("shown");}, 120 + Math.random()*1000); so.unobserve(t);} }); },{threshold:.15});
    stickers.forEach(function(i){ so.observe(i); });
  }

  // Section reveal
  var reveals=[].slice.call(document.querySelectorAll(".reveal"));
  if(reduce || !("IntersectionObserver" in window)){ reveals.forEach(function(r){ r.classList.add("shown"); }); }
  else { var ro=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("shown"); ro.unobserve(e.target);} }); },{threshold:.08}); reveals.forEach(function(r){ ro.observe(r); }); }

  // On a language switch the whole body is replaced. Show the new nodes at once
  // instead of replaying the scroll entrance — the reader is mid-page and would
  // otherwise watch the deck blank out and fade back in.
  document.addEventListener("deck:rendered", function(){
    [].forEach.call(document.querySelectorAll("#d-body img"), function(i){ if(!i.classList.contains("pf-icon")) i.classList.add("stk-in","shown"); });
    [].forEach.call(document.querySelectorAll("#d-body .reveal"), function(r){ r.classList.add("shown"); });
  });

  // Typewriter (preserves inline-styled segments like the italic "Bi-Weekly")
  function typewrite(node){
    if(!node) return;
    var segs=[]; [].forEach.call(node.childNodes, function(n){
      if(n.nodeType===3) segs.push({t:n.nodeValue,s:null,tag:null});
      else if(n.nodeType===1){
        if(n.tagName==="BR") segs.push({br:true});
        else segs.push({t:n.textContent,s:n.getAttribute("style"),tag:n.tagName});
      }
    });
    // Reserve the fully-laid-out height BEFORE clearing so the block doesn't grow
    // line-by-line while typing (the phrase wraps to 2 lines).
    node.style.minHeight = node.offsetHeight + "px";
    node.textContent=""; node.classList.add("tw-caret");
    var si=0,ci=0,cur=null;
    (function step(){
      if(si>=segs.length){ node.classList.remove("tw-caret"); return; }
      var seg=segs[si];
      if(seg.br){ node.appendChild(document.createElement("br")); si++; ci=0; cur=null; return step(); }
      if(ci===0){ if(seg.s!==null){ cur=document.createElement(seg.tag||"span"); if(seg.s) cur.setAttribute("style",seg.s); node.appendChild(cur);} else cur=null; }
      var ch=seg.t.charAt(ci); if(cur) cur.textContent+=ch; else node.appendChild(document.createTextNode(ch));
      ci++; if(ci>=seg.t.length){ si++; ci=0; }
      setTimeout(step, 34);
    })();
  }
  if(!reduce){
    // Typewriter runs only on the bottom sign-off heading (the hero shows immediately).
    var wrap=document.getElementById("wrap-title");
    if(wrap && "IntersectionObserver" in window){ var did=false; var wo=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting && !did){ did=true; typewrite(wrap); wo.unobserve(e.target);} }); },{threshold:.4}); wo.observe(wrap); }
  }
})();
</script>

<!-- Link-click tracking -> dataLayer (for GTM triggers) -->
<script>
(function(){
  window.dataLayer = window.dataLayer || [];
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if(!a) return;
    var host=""; try{ host=new URL(a.href).hostname; }catch(_){}
    var sec = a.closest("#d-body > section[data-team]");
    var h2 = sec ? sec.querySelector("h2") : null;
    var loc = a.closest("article") ? "card" : (a.closest("#d-archive") ? "archive" : "other");
    var af = document.querySelector("#news-filter .flt.active");
    window.dataLayer.push({
      event: "link_click",
      link_url: a.href,
      link_text: (a.textContent||"").trim().slice(0,140),
      link_domain: host,
      link_team: sec ? sec.getAttribute("data-team") : "",
      link_platform: h2 ? h2.textContent.trim() : "",
      link_location: loc,
      active_filter: af ? af.getAttribute("data-team") : ""
    });
  }, true);
})();
</script>
