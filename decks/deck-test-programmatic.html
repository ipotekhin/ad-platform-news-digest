<title>Ad Platform News Digest</title>
<!--
  ZINE DECK TEMPLATE — used by Routine 2 (Presentation).

  HOW ROUTINE 2 USES THIS FILE:
    1. Copy this file to decks/deck-YYYY-MM-DD.html
    2. Replace the single line  <script id="deck-data" ...> ... </script>
       with a filled-in DECK_DATA object (schema documented in that block below).
    3. Nothing else needs editing. All rendering is data-driven.

  Not zero-request: this skin pulls Playfair Display + Courier Prime from Google
  Fonts CDN and reads sticker PNGs from ../assets/stickers/ (repo-relative, works
  identically from style/ and from decks/ since both sit one level below repo
  root). It also loads Google Tag Manager (container GTM-M2BTR42L) for analytics,
  and pushes a `link_click` event to the dataLayer on every <a> click (for GTM
  triggers). Those are the only third-party requests — do not add other analytics
  or third-party JS/CSS. Fine to serve from GitHub Pages and to print to PDF.

  No dark-mode variant — this skin is a light/cream editorial look by design
  (see the Claude Design "Zine" direction it implements); it does not adapt to
  prefers-color-scheme like the previous template did.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --aid-blue:     rgb(0, 9, 220);
    --aid-blue-50:  rgb(245, 245, 254);
    --aid-ink:      rgb(11, 11, 11);
    --aid-slate:    rgb(51, 52, 74);
    --aid-mute:     rgb(128, 128, 142);
    --aid-pink:     rgb(240, 52, 142);
    --aid-lime:     rgb(174, 243, 62);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{margin:0;background:#f4f1ea;color:var(--aid-ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--aid-blue);text-decoration:none}
  a:hover{opacity:.78}
  ::selection{background:var(--aid-lime)}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}}
  .card-hov{transition:transform .18s ease, box-shadow .18s ease}
  .card-hov:hover{transform:translate(-2px,-2px)}
  .lnk-underline{background-image:linear-gradient(var(--aid-blue),var(--aid-blue));background-size:0% 2px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .25s ease}
  .lnk-underline:hover{background-size:100% 2px;opacity:1}
  .empty{color:var(--aid-mute);font-style:italic}
  @media print{
    header[style*="sticky"]{position:static}
    img[style*="floaty"]{animation:none}
  }

  /* ── Header controls: news filter + language (shared dropdown chrome) ──
     Both controls are pills of the same family. The language pill is always a
     dropdown; the news filter is the original segmented slider on desktop
     (≥641px) and collapses to the same dropdown pill on phones, so the header
     keeps a fixed, compact footprint however many filters we add later. */
  .hdr-ctl{display:flex;align-items:center;gap:10px;flex:none}
  .dd{position:relative;flex:none}
  /* Height is set explicitly (not left to font metrics) so the pill matches the
     desktop filter slider exactly whether or not the webfont has loaded. The 1px
     of top-only padding optically centres the label: uppercase has no descenders,
     so a strictly box-centred line reads as sitting high. */
  .dd-toggle{display:inline-flex;align-items:center;gap:7px;height:36px;border:2px solid var(--aid-ink);border-radius:999px;background:#fff;cursor:pointer;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aid-ink);padding:1px 13px 0;line-height:1;white-space:nowrap;transition:background .18s}
  .dd-toggle:hover{background:var(--aid-lime)}
  .dd-car{font-size:9px;line-height:1;transition:transform .22s}
  .dd.open .dd-car{transform:rotate(180deg)}
  /* Frosted-glass popup. It is position:fixed and gets moved to <body> when it
     opens — see openPanel() below. The header sets its own backdrop-filter, which
     makes it a backdrop root, and a backdrop-filter nested inside one samples an
     empty backdrop: the popup would render with no blur at all. Living on <body>
     while open puts it back over the real page content. */
  .opts{position:fixed;z-index:80;display:none;flex-direction:column;gap:2px;padding:6px;border:2px solid var(--aid-ink);border-radius:16px;background:rgba(255,255,255,.55);backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);box-shadow:4px 5px 0 rgba(26,26,26,.16)}
  .opts.open{display:flex}
  .opts button{display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aid-ink);padding:8px 12px;border-radius:999px;white-space:nowrap;text-align:left;transition:background .15s,color .15s}
  .opts button:hover{background:rgba(43,90,224,.14)}
  .opts button.active{background:var(--aid-blue);color:#fff}
  .flt-ind{display:none}
  /* "View all editions" toggle under the editions strip. */
  #d-archive-more{margin-top:14px;border:2px solid var(--aid-ink);border-radius:999px;background:#fff;cursor:pointer;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--aid-ink);padding:9px 16px 8px;line-height:1;transition:background .18s}
  #d-archive-more:hover{background:var(--aid-lime)}
  /* Collapsed-away edition cards. A class, not an inline display, because the cards
     carry an inline `display:flex` that stacks their two lines — clearing that to
     un-hide them would drop them to `block` and put both lines on one row. */
  .ed-hidden{display:none!important}
  /* Desktop: the news filter goes back to being a segmented slider — its panel
     stays in place (never portaled) because its toggle is hidden here. */
  @media (min-width:641px){
    #news-filter{display:inline-flex;height:36px;border:2px solid var(--aid-ink);border-radius:999px;background:#fff;padding:3px}
    #news-filter>.dd-toggle{display:none}
    #news-filter .opts{position:relative;z-index:auto;display:inline-flex;flex-direction:row;gap:0;padding:0;border:0;border-radius:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
    #news-filter .opts button{position:relative;z-index:1;height:100%;padding:6px 14px;transition:color .2s}
    #news-filter .opts button:hover{background:transparent}
    #news-filter .opts button.active{background:transparent;color:#fff}
    #news-filter .flt-ind{display:block;position:absolute;left:0;top:0;bottom:0;z-index:0;border-radius:999px;background:var(--aid-blue);transition:transform .3s cubic-bezier(.5,1.5,.4,1),width .3s cubic-bezier(.5,1.5,.4,1)}
  }
  /* ── Team headings ("Search News" …) ──
     Centred between two rules, in the hero's accent: the team word in italic blue,
     like "Bi-Weekly". One heads each team's block in All news; with a team selected
     only that team's heading shows, so it always names the section being read. */
  .team-head{display:flex;align-items:center;gap:22px;margin:10px 0 36px}
  .team-head::before,.team-head::after{content:"";flex:1;height:2px;background:var(--aid-ink)}
  .team-head h3{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(34px,4.6vw,52px);line-height:1;letter-spacing:-.01em;margin:0;color:var(--aid-ink);white-space:nowrap}
  .team-head em{font-style:italic;color:var(--aid-blue)}
  /* ── Typewriter caret ── */
  .tw-caret::after{content:"";display:inline-block;width:.055em;height:.92em;background:currentColor;margin-left:.05em;vertical-align:-.06em;animation:tw-blink .8s steps(1) infinite}
  @keyframes tw-blink{50%{opacity:0}}
  /* ── Sticker entrance (uses `scale` so it won't fight the floaty transform) ── */
  img.stk-in{opacity:0;scale:.5;transition:opacity .5s ease,scale .6s cubic-bezier(.34,1.56,.64,1)}
  img.stk-in.shown{opacity:1;scale:1}
  /* ── Section reveal (smooth top-to-bottom) ── */
  .reveal{opacity:0;translate:0 18px;transition:opacity .6s ease,translate .6s cubic-bezier(.22,1,.36,1)}
  .reveal.shown{opacity:1;translate:0 0}
  @media (prefers-reduced-motion: reduce){
    img.stk-in,img.stk-in.shown{opacity:1;scale:1;transition:none}
    .reveal,.reveal.shown{opacity:1;translate:0 0;transition:none}
    .tw-caret::after{display:none}
  }
  /* ── Mobile polish (phones only; desktop ≥641px is untouched) ── */
  @media (max-width:640px){
    /* The large floating stickers are positioned for the wide layout and cover
       text on narrow screens — hide them here. Inline heading/card stickers stay. */
    #dec-hero-1,#dec-hero-2,#dec-signoff-1,#dec-signoff-2{display:none}
    /* Center the footer credits instead of stretching them edge-to-edge. */
    footer>div{flex-direction:column;text-align:center}
    /* Tighter side gutters + block padding so cards/headings don't hug the edge. */
    body section,body main,body header>div,footer>div{padding-left:20px!important;padding-right:20px!important}
    .signoff-card{padding:40px 26px!important}
    /* Sign-off heading: smaller on phones and let both sentences flow together
       (drop the forced break) so it fills ~2 lines instead of 4. */
    .signoff-card h2{font-size:clamp(20px,5.2vw,25px)!important;line-height:1.2!important}
    .signoff-card h2 br{display:none}
    /* Header: keep the brand on the LEFT and the filter on the RIGHT in one row
       (like desktop). Compact the filter and let the brand wrap to 2–3 lines so
       both fit on narrow phones without running off the edge. */
    header>div>div:first-child{min-width:0}
    header>div>div:first-child span:last-child{font-size:11px;letter-spacing:.09em;line-height:1.25}
    /* Both header controls are dropdown pills here — see the .dd rules above.
       Shorter pill (30px), same explicit height + 1px top bias as desktop. */
    .hdr-ctl{gap:7px}
    .dd-toggle{height:30px;padding:1px 10px 0;gap:5px;letter-spacing:.02em}
    .team-head{gap:12px}
    .team-head h3{font-size:32px}
    /* Platform sections sit inside <main>, which already has the gutter — don't add a
       second one, so cards line up with the section headings. */
    #d-body > section{padding-left:0!important;padding-right:0!important}
    /* Platform names at 38px push the icon, name and counter onto three lines. */
    #d-body > section h2{font-size:30px!important}
  }
</style>

<style id="hv-test">
  /* B — mono-caps lime pill sitting on a full-width rule */
  body.hv-b .team-head{position:relative;justify-content:center;gap:0}
  body.hv-b .team-head::before{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px}
  body.hv-b .team-head::after{display:none}
  body.hv-b .team-head h3{position:relative;font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;background:var(--aid-lime);border:2px solid var(--aid-ink);border-radius:999px;padding:10px 24px 9px;box-shadow:3px 3px 0 var(--aid-ink)}
  body.hv-b .team-head em{font-style:normal;color:var(--aid-ink)}
  /* C — blue banner block, white heading with the team word in lime italic */
  body.hv-c .team-head{justify-content:center;background:var(--aid-blue);border:2px solid var(--aid-ink);border-radius:20px;padding:26px 20px 28px;box-shadow:10px 11px 0 var(--aid-ink)}
  body.hv-c .team-head::before,body.hv-c .team-head::after{display:none}
  body.hv-c .team-head h3{color:#fff}
  body.hv-c .team-head em{color:var(--aid-lime)}
  /* D — editorial: mono kicker over a large left-aligned heading, thick top rule */
  body.hv-d .team-head{flex-direction:column;align-items:flex-start;gap:8px;border-top:3px solid var(--aid-ink);padding-top:18px}
  body.hv-d .team-head::after{display:none}
  body.hv-d .team-head::before{content:attr(data-kicker);flex:none;height:auto;background:none;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--aid-mute)}
  body.hv-d .team-head h3{font-size:clamp(44px,6vw,68px)}
  #hv-bar{position:fixed;left:16px;bottom:16px;z-index:90;display:flex;align-items:center;gap:6px;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:#fff;border:2px solid var(--aid-ink);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:3px 3px 0 var(--aid-ink)}
  #hv-bar a{color:var(--aid-ink);border:1.5px solid var(--aid-ink);border-radius:999px;padding:3px 10px}
  #hv-bar a.on{background:var(--aid-blue);color:#fff}
</style>
</head>

<!-- ─────────────────────────────────────────────────────────────────────────
     DECK_DATA — Routine 2 replaces the contents of this script block.
     Required:
     {
       "period_label": "Jul 7 – Jul 21, 2026",   // window covered
       "generated": "2026-07-21",                  // ISO date deck was built
       "platforms": [                              // ordered; empty ones omitted
         {
           "name": "Google Ads",                   // display name (e.g. "Microsoft Programmatic")
           "team": "search",                       // search | social | programmatic — which filter it sits under
           "items": [
             {
               "title": "…",
               "url": "https://…",
               "source": "Google Ads & Commerce Blog",
               "published": "2026-07-14",
               "category": "feature",              // feature|beta|policy|deprecation|measurement|api|other
               "impact": "high",                   // high|medium|low
               "summary": "2–3 sentences."
             }
           ]
         }

  if(filter){
    var opts=filter.querySelector(".opts");
    var btns=[].slice.call(filter.querySelectorAll(".flt"));
    var fcur=filter.querySelector(".dd-cur");
    var ind=document.createElement("div"); ind.className="flt-ind"; opts.insertBefore(ind, opts.firstChild);
    function moveInd(btn){ ind.style.width=btn.offsetWidth+"px"; ind.style.transform="translateX("+btn.offsetLeft+"px)"; }
    function apply(team){
      var secs=[].slice.call(document.querySelectorAll('#d-body > section'));
      secs.forEach(function(s){ s.style.display=(team==="all"||s.getAttribute("data-team")===team)?"":"none"; });
      // Team headings: every one in All news, only the selected team's otherwise.
      [].forEach.call(document.querySelectorAll('#d-body > .team-head'), function(h){ h.style.display=(team==="all"||h.getAttribute("data-team")===team)?"":"none"; });
      var vis=secs.filter(function(s){return s.style.display!=="none";});
      var items=0; vis.forEach(function(s){ items+=s.querySelectorAll('article').length; });
      var su=document.getElementById('stat-updates'); if(su) su.textContent=items;
      var sp=document.getElementById('stat-platforms'); if(sp) sp.textContent=vis.length;
      var sr=document.getElementById('stat-readmin'); if(sr && window.__deck && window.__deck.readMinutes) sr.textContent=window.__deck.readMinutes(items, team);
      // A team with nothing this edition (e.g. an older deck opened with ?team=programmatic).
      var empty=document.getElementById('d-team-empty');
      if(empty){
        var lbl=(window.__deck && window.__deck.teamLabel && window.__deck.teamLabel[team]) || team;
        empty.textContent = (team!=="all" && secs.length && !vis.length) ? ("No " + lbl + " updates in this edition.") : "";
        empty.style.display = empty.textContent ? "" : "none";
      }
      if(window.__deck && window.__deck.setTeam) window.__deck.setTeam(team);
    }
    function btnFor(team){ for(var i=0;i<btns.length;i++){ if(btns[i].getAttribute("data-team")===team) return btns[i]; } return null; }
    function select(team, updateURL){
      var b=btnFor(team); if(!b) return;
      curTeam=team;
      btns.forEach(function(x){x.classList.remove("active");}); b.classList.add("active");
      moveInd(b); if(fcur) fcur.textContent=b.textContent; apply(team);
      if(updateURL) setParam("team", team, "all");
    }
    btns.forEach(function(b){ b.addEventListener("click", function(){ select(b.getAttribute("data-team"), true); closeDD(); }); });
    // Deep link: ?team=search|social|programmatic (|all) opens the deck with that filter
    // pre-applied. Routine 2 uses this to send each team a link straight to its own
    // view; readers can switch to All news in the header. Unknown/absent value falls
    // back to "all".
    var want="all";
    try{ var q=new URLSearchParams(window.location.search).get("team"); if(q){ q=q.toLowerCase(); if(btnFor(q)){ want=q; } } }catch(e){}
    requestAnimationFrame(function(){ select(want, false); });
    // A language switch rebuilds #d-body, so re-apply the current filter to it.
    document.addEventListener("deck:rendered", function(){ apply(curTeam); });
    window.addEventListener("resize", function(){ closeDD(); var a=filter.querySelector(".flt.active"); if(a) moveInd(a); });
  }

  // Language switcher — swaps card titles/summaries + the hero subtitle (see the
  // render script above); every other string on the page stays English.
  var langDD=document.getElementById("lang-dd");
  if(langDD && window.__deck){
    var lbtns=[].slice.call(langDD.querySelectorAll(".lng"));
    var lcur=langDD.querySelector(".dd-cur");
    function selectLang(lang, rerender){
      var b=null;
      lbtns.forEach(function(x){ var on=x.getAttribute("data-lang")===lang; x.classList.toggle("active",on); if(on) b=x; });
      if(!b) return;
      if(lcur) lcur.textContent=b.textContent;
      if(rerender){
        window.__deck.render(lang);
        setParam("lang", lang, "en");   // URL only — the choice is not stored
      }
    }
    lbtns.forEach(function(b){ b.addEventListener("click", function(){ selectLang(b.getAttribute("data-lang"), true); closeDD(); }); });
    selectLang(window.__deck.lang, false);   // first render already used this language
  }

  // Sticker entrance (exclude platform icons and always-static stickers like Past editions)
  var stickers=[].slice.call(document.querySelectorAll("img")).filter(function(i){ return !i.classList.contains("pf-icon") && !i.classList.contains("stk-static"); });
  if(reduce || !("IntersectionObserver" in window)){ stickers.forEach(function(i){ i.classList.add("stk-in","shown"); }); }
  else {
    stickers.forEach(function(i){ i.classList.add("stk-in"); });
    // Wide, randomized delay so stickers in view pop in one-by-one (chaotic), not all at once.
    var so=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ var t=e.target; setTimeout(function(){t.classList.add("shown");}, 120 + Math.random()*1000); so.unobserve(t);} }); },{threshold:.15});
    stickers.forEach(function(i){ so.observe(i); });
  }

  // Section reveal
  var reveals=[].slice.call(document.querySelectorAll(".reveal"));
  if(reduce || !("IntersectionObserver" in window)){ reveals.forEach(function(r){ r.classList.add("shown"); }); }
  else { var ro=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("shown"); ro.unobserve(e.target);} }); },{threshold:.08}); reveals.forEach(function(r){ ro.observe(r); }); }

  // On a language switch the whole body is replaced. Show the new nodes at once
  // instead of replaying the scroll entrance — the reader is mid-page and would
  // otherwise watch the deck blank out and fade back in.
  document.addEventListener("deck:rendered", function(){
    [].forEach.call(document.querySelectorAll("#d-body img"), function(i){ if(!i.classList.contains("pf-icon")) i.classList.add("stk-in","shown"); });
    [].forEach.call(document.querySelectorAll("#d-body .reveal"), function(r){ r.classList.add("shown"); });
  });

  // Typewriter (preserves inline-styled segments like the italic "Bi-Weekly")
  function typewrite(node){
    if(!node) return;
    var segs=[]; [].forEach.call(node.childNodes, function(n){
      if(n.nodeType===3) segs.push({t:n.nodeValue,s:null,tag:null});
      else if(n.nodeType===1){
        if(n.tagName==="BR") segs.push({br:true});
        else segs.push({t:n.textContent,s:n.getAttribute("style"),tag:n.tagName});
      }
    });
    // Reserve the fully-laid-out height BEFORE clearing so the block doesn't grow
    // line-by-line while typing (the phrase wraps to 2 lines).
    node.style.minHeight = node.offsetHeight + "px";
    node.textContent=""; node.classList.add("tw-caret");
    var si=0,ci=0,cur=null;
    (function step(){
      if(si>=segs.length){ node.classList.remove("tw-caret"); return; }
      var seg=segs[si];
      if(seg.br){ node.appendChild(document.createElement("br")); si++; ci=0; cur=null; return step(); }
      if(ci===0){ if(seg.s!==null){ cur=document.createElement(seg.tag||"span"); if(seg.s) cur.setAttribute("style",seg.s); node.appendChild(cur);} else cur=null; }
      var ch=seg.t.charAt(ci); if(cur) cur.textContent+=ch; else node.appendChild(document.createTextNode(ch));
      ci++; if(ci>=seg.t.length){ si++; ci=0; }
      setTimeout(step, 34);
    })();
  }
  if(!reduce){
    // Typewriter runs only on the bottom sign-off heading (the hero shows immediately).
    var wrap=document.getElementById("wrap-title");
    if(wrap && "IntersectionObserver" in window){ var did=false; var wo=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting && !did){ did=true; typewrite(wrap); wo.unobserve(e.target);} }); },{threshold:.4}); wo.observe(wrap); }
  }
})();
</script>

<!-- Link-click tracking -> dataLayer (for GTM triggers) -->
<script>
(function(){
  window.dataLayer = window.dataLayer || [];
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if(!a) return;
    var host=""; try{ host=new URL(a.href).hostname; }catch(_){}
    var sec = a.closest("#d-body > section[data-team]");
    var h2 = sec ? sec.querySelector("h2") : null;
    var loc = a.closest("article") ? "card" : (a.closest("#d-archive") ? "archive" : "other");
    var af = document.querySelector("#news-filter .flt.active");
    window.dataLayer.push({
      event: "link_click",
      link_url: a.href,
      link_text: (a.textContent||"").trim().slice(0,140),
      link_domain: host,
      link_team: sec ? sec.getAttribute("data-team") : "",
      link_platform: h2 ? h2.textContent.trim() : "",
      link_location: loc,
      active_filter: af ? af.getAttribute("data-team") : ""
    });
  }, true);
})();
</script>

  if("abcd".indexOf(v)<0||v.length!==1) v="a";
  document.body.classList.add("hv-"+v);
  function number(){ var hs=document.querySelectorAll("#d-body > .team-head");
    [].forEach.call(hs,function(h,i){ h.setAttribute("data-kicker","Section "+String(i+1).padStart(2,"0")+" / "+String(hs.length).padStart(2,"0")); }); }
  number(); document.addEventListener("deck:rendered", number);
  var bar=document.createElement("div"); bar.id="hv-bar"; bar.appendChild(document.createTextNode("Heading "));
  "abcd".split("").forEach(function(x){ var q=new URLSearchParams(location.search); q.set("hv",x);
    var a=document.createElement("a"); a.textContent=x.toUpperCase(); a.href="?"+q.toString(); if(x===v) a.className="on"; bar.appendChild(a); });

})();
